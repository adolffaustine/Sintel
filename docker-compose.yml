version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sintel
      POSTGRES_USER: sintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-STRONGPASSWORD}
      DATABASE_URL: postgresql://sintel:${POSTGRES_PASSWORD:-STRONGPASSWORD}@postgres:5432/sintel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sintel -d sintel"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4031
    expose:
      - "4031"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/client/dist/uploads

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
      - uploads:/app/client/dist/uploads:ro
    depends_on:
      - app

volumes:
  pgdata:
  certbot_www:
  certbot_conf:
  uploads:
